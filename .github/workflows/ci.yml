name: CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

env:
  CARGO_TERM_COLOR: always
  SLINT_BACKEND: winit # 在 CI 环境中强制使用 winit 后端进行无头检查

jobs:
  test:
    name: Test and Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            os: linux
          - platform: windows-latest
            os: windows
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libx11-dev \
            libxft-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxcursor-dev \
            libxrender-dev \
            libxinerama-dev \
            libxrandr-dev \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            pkg-config \
            cmake \
            xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Linting (Clippy -D warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Tests (Linux with Virtual X)
        if: matrix.os == 'linux'
        run: xvfb-run --auto-servernum cargo test --lib --bins

      - name: Run Tests (Windows Native)
        if: matrix.os == 'windows'
        run: cargo test --lib --bins

      - name: Security & Supply Chain Audit
        uses: rustsec/audit-check@v2.0.0
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
