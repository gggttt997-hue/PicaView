name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows (MSI & Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binaries
        run: cargo build --release

      - name: Package Portable Zip
        run: |
          New-Item -ItemType Directory -Path "target\portable\picaview" -Force | Out-Null
          Copy-Item "target\release\picaview.exe" -Destination "target\portable\picaview\"
          Copy-Item "target\release\picaview-ep.exe" -Destination "target\portable\picaview\"
          Copy-Item "LICENSE" -Destination "target\portable\picaview\"
          Copy-Item "README.md" -Destination "target\portable\picaview\"
          Compress-Archive -Path "target\portable\picaview\*" -DestinationPath "target\picaview-windows-x86_64-portable.zip" -Force

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Build MSI Installer
        run: cargo wix --nocapture
        
      - name: Setup Code Signing Certificate
        if: env.CERTIFICATE_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String($env:CERTIFICATE_BASE64)
          [IO.File]::WriteAllBytes("$pwd\Cert.pfx", $pfx_cert_byte)

      - name: Sign MSI Package (Optional)
        if: env.CERTIFICATE_BASE64 != ''
        env:
          CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          $msiFile = Get-ChildItem -Path target\wix -Filter *.msi | Select-Object -First 1
          if ($msiFile) {
            & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x86\signtool.exe" sign /f "$pwd\Cert.pfx" /p "$env:CERT_PASSWORD" /tr http://timestamp.digicert.com /td sha256 /fd sha256 /a $msiFile.FullName
            Write-Host "Successfully signed $($msiFile.Name)"
          } else {
            Write-Error "MSI file not found for signing"
          }

      - name: Upload Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/wix/*.msi
            target/picaview-windows-x86_64-portable.zip
          generate_release_notes: true

      - name: Cleanup Certificate
        if: always()
        run: |
          if (Test-Path "$pwd\Cert.pfx") { Remove-Item "$pwd\Cert.pfx" -Force }

  build-linux:
    name: Build Linux Portable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libx11-dev \
            libxft-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxcursor-dev \
            libxrender-dev \
            libxinerama-dev \
            libxrandr-dev \
            libasound2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            pkg-config \
            cmake

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release
        run: cargo build --release

      - name: Package Tarball
        run: |
          mkdir -p target/dist
          cp target/release/picaview target/dist/
          cp target/release/picaview-ep target/dist/
          cp LICENSE target/dist/
          cp README.md target/dist/
          tar -czvf picaview-linux-x86_64.tar.gz -C target/dist .

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: picaview-linux-x86_64.tar.gz
